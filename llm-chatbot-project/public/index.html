<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Ollama Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f7fa; }
    .app { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 16px; }
    .chat-window { background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 16px; min-height: 360px; }
    .message { margin-bottom: 12px; }
    .message.user { text-align: right; }
    .message .bubble { display: inline-block; padding: 12px 16px; border-radius: 18px; max-width: 85%; }
    .message.user .bubble { background: #4f46e5; color: #fff; }
    .message.assistant .bubble { background: #e5e7eb; color: #111827; }
    .input-row { display: flex; gap: 8px; margin-top: 16px; }
    input[type="text"] { flex: 1; padding: 12px 14px; border-radius: 999px; border: 1px solid #d1d5db; }
    button { padding: 12px 20px; border: none; border-radius: 999px; background: #4f46e5; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Python Ollama Chatbot</h1>
    <div style="margin-bottom:12px; display:flex; gap:8px; align-items:center;">
      <input id="fileInput" type="file" accept="application/pdf" />
      <button id="uploadButton">Upload PDF</button>
      <div id="uploadStatus" style="font-size:0.9rem;color:#374151;margin-left:8px"></div>
    </div>
    <div style="margin-bottom:12px; display:flex; gap:8px; align-items:center;">
      <input id="pdfQuestionInput" type="text" placeholder="Ask about uploaded PDF..." style="flex:1;padding:8px;border-radius:8px;border:1px solid #d1d5db;"/>
      <button id="pdfAskButton">Ask PDF</button>
    </div>
    <div class="chat-window" id="chatWindow"></div>
    <div class="input-row">
      <input id="messageInput" type="text" placeholder="Ask something..." autocomplete="off" />
      <button id="sendButton">Send</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
